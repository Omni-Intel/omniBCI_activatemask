[project]
name = "onmibci-activatemask"
version = "0.1.0"
description = "OmniBCI ADS1299 desktop acquisition and analysis application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bleak>=1.1,<4",
    "numpy>=1.24",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "pyside6>=6.5",
    "scipy>=1.10",
]

[project.optional-dependencies]
export = [
    "mne>=1.6",
    "pyedflib>=0.1.39",
]

[project.scripts]
omnibci = "omnibci_app.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://mirrors.sustech.edu.cn/pypi/web/simple"
default = true
