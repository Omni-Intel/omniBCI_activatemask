name: Build OmniBCI V19 Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'ads1299_eeg_gui_native.py'
      - 'app_diagnostics.py'
      - 'onmibci_*.py'
      - 'omnibci/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'build_exe.bat'
      - 'OmniBCI_V19.spec'
      - 'assets/**'
      - '.github/workflows/build-v16-windows-exe.yml'

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Validate ONEDIR build without uploading binaries
        shell: cmd
        run: build_exe.bat --non-interactive
