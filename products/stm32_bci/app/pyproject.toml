[project]
name = "onmibci-activatemask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bleak>=1.1,<4",
    "numpy>=1.24",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "pyside6>=6.5",
    "scipy>=1.10",
    "websockets>=14,<16",
]

[project.optional-dependencies]
export = [
    "mne>=1.6",
    "pyedflib>=0.1.39",
]

[[tool.uv.index]]
url = "https://mirrors.sustech.edu.cn/pypi/web/simple"
default = true

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pyinstaller>=6.10,<7",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"onmibci_gui/common.py" = ["F401"]
"onmibci_gui/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
files = [
    "app_diagnostics.py",
    "onmibci_ble_protocol.py",
    "onmibci_sdk.py",
    "onmibci_stream.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
